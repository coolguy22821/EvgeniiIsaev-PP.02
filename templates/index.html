<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Регистрация</title></head><body>
<h1>Регистрация на студенческий конкурс</h1>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<p>{{m}}</p>{% endfor %}{% endwith %}
<form action="/register" method="post">
<p>ФИО <input name="full_name" required></p><p>Группа <input name="group_name" required></p>
<p>Email <input name="email" type="email" required></p><p>Конкурс <input name="competition_name" required></p>
<button>Отправить заявку</button></form>
<p><a href="/registrations">Заявки</a> | <a href="/notifications">Журнал уведомлений</a></p></body></html>
