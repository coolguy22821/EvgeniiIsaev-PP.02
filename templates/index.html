<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация на конкурс</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 18px; background: #f5f7fb; }
        main { background: white; padding: 28px; border-radius: 12px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
        button { margin-top: 20px; padding: 11px 18px; background: #2457c5; color: white; border: 0; border-radius: 6px; }
        .success { color: #187a38; } .error { color: #b3261e; }
    </style>
</head>
<body>
<main>
    <h1>Регистрация на студенческий конкурс</h1>
    <p>Заполните форму, чтобы подать заявку на участие.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    <form action="{{ url_for('register') }}" method="post">
        <label>ФИО
            <input name="full_name" required maxlength="120">
        </label>
        <label>Учебная группа
            <input name="group_name" required maxlength="40">
        </label>
        <label>Электронная почта
            <input name="email" type="email" required maxlength="120">
        </label>
        <label>Название конкурса
            <input name="competition_name" required maxlength="150">
        </label>
        <button type="submit">Отправить заявку</button>
    </form>
    <p><a href="{{ url_for('registrations') }}">Посмотреть список заявок (демо)</a></p>
</main>
</body>
</html>
